<!DOCTYPE html>
<html>
<head>
  <title>Inversare Alfabet</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { margin-top: 10px; padding: 8px; font-size: 16px; }
  </style>
</head>
<body>

  <h2>Inversare Alfabetică (a devine z, b devine y, etc.)</h2>
  
  <label for="textInput">Introdu un text:</label><br>
  <input type="text" id="textInput" placeholder="ex: abcXYZ"><br>
  <button onclick="inverseAlphabet()">Transformă</button>

  <h3>Rezultat:</h3>
  <p id="result"></p>

  <script>
    function inverseAlphabetChar(char) {
      const isLower = char >= 'a' && char <= 'z';
      const isUpper = char >= 'A' && char <= 'Z';

      if (isLower) {
        return String.fromCharCode(219 - char.charCodeAt(0)); // 97 + 122 = 219
      } else if (isUpper) {
        return String.fromCharCode(155 - char.charCodeAt(0)); // 65 + 90 = 155
      }
      return char;
    }

    function inverseAlphabet() {
      const input = document.getElementById("textInput").value;
      const transformed = input.split('').map(inverseAlphabetChar).join('');
      document.getElementById("result").textContent = transformed;
    }
  </script>

</body>
</html>
