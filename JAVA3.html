<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numere Armstrong</title>
    <script>
        function esteArmstrong(num) {
            let suma = 0;
            let temp = num;
            let lungime = num.toString().length;
            
            while (temp > 0) {
                let cifra = temp % 10;
                suma += Math.pow(cifra, lungime);
                temp = Math.floor(temp / 10);
            }
            
            return suma === num;
        }

        function afiseazaArmstrong() {
            let start = parseInt(document.getElementById("start").value);
            let end = parseInt(document.getElementById("end").value);
            let rezultat = "";

            for (let i = start; i <= end; i++) {
                if (esteArmstrong(i)) {
                    rezultat += i + " ";
                }
            }

            document.getElementById("rezultat").textContent = rezultat || "Nu există numere Armstrong în acest interval.";
        }
    </script>
</head>
<body>
    <h2>Găsește numere Armstrong</h2>
    <label for="start">Început:</label>
    <input type="number" id="start">
    <label for="end">Sfârșit:</label>
    <input type="number" id="end">
    <button onclick="afiseazaArmstrong()">Afișează</button>
    <p id="rezultat"></p>
</body>
</html>
